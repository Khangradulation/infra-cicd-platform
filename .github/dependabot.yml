# Dependency and action updates. Every bump arrives as a PR and must pass
# the same CI gates (tests, Trivy, Checkov, plan) as any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci" }

  - package-ecosystem: pip
    directory: /application
    schedule: { interval: weekly, day: monday }
    groups:
      python-runtime:
        patterns: ["flask", "gunicorn", "werkzeug", "jinja2", "markupsafe", "itsdangerous", "click", "blinker"]
      python-dev:
        patterns: ["pytest*", "coverage", "ruff", "pluggy", "iniconfig", "packaging", "pygments"]
    commit-message: { prefix: "deps" }

  - package-ecosystem: docker
    directory: /application
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "deps(docker)" }

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/environments/*
    schedule: { interval: weekly, day: monday }
    groups:
      terraform-providers: { patterns: ["*"] }
    commit-message: { prefix: "deps(terraform)" }

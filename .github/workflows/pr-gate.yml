# The required status check for app-ci and terraform-pr. Those use `paths:`
# filters, so requiring them directly would block every PR they skip. See
# scripts/pr-gate.py. If a checked workflow fails and you re-run it, re-run this too.
name: pr-gate

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the workflows this PR triggers
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/pr-gate.py

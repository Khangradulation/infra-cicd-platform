# Scheduled security sweep so newly published CVEs are caught even when no
# code changes: Trivy (dependencies, IaC misconfig, secrets) + Checkov.
name: security-scan

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools (sha256-verified)
        run: scripts/install-ci-tools.sh trivy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Trivy filesystem (dependencies + secrets)
        run: trivy fs --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 .
      - name: Trivy config (Terraform, Dockerfile, workflows)
        run: trivy config --quiet --severity HIGH,CRITICAL --exit-code 1 .
      - name: Checkov
        run: |
          pip install --disable-pip-version-check checkov==3.4.3
          checkov --config-file .checkov.yaml
